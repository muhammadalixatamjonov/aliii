<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velorah® — Cinematic Experience</title>
  <meta name="description" content="Where dreams rise through the silence. Digital spaces for deep thinkers, bold creators, and quiet rebels.">
  <meta property="og:title" content="Velorah® — Cinematic Experience">
  <meta property="og:description" content="Where dreams rise through the silence. Digital spaces for deep thinkers, bold creators, and quiet rebels.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'hsl(201, 100%, 13%)',
            foreground: 'hsl(0, 0%, 100%)',
            'muted-foreground': 'hsl(240, 4%, 66%)',
            primary: 'hsl(0, 0%, 100%)',
            'primary-foreground': 'hsl(0, 0%, 4%)',
            border: 'hsl(0, 0%, 18%)',
          },
          fontFamily: {
            display: ["'Instrument Serif'", "serif"],
            body: ["'Inter'", "sans-serif"],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --font-display: 'Instrument Serif', serif;
      --font-body: 'Inter', sans-serif;
      --background: 201 100% 13%;
      --foreground: 0 0% 100%;
      --muted-foreground: 240 4% 66%;
      --primary: 0 0% 100%;
      --primary-foreground: 0 0% 4%;
      --secondary: 0 0% 10%;
      --muted: 0 0% 10%;
      --accent: 0 0% 10%;
      --border: 0 0% 18%;
      --input: 0 0% 18%;
    }

    body {
      font-family: var(--font-body);
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Liquid Glass Effect */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    @keyframes fade-rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-rise {
      animation: fade-rise 0.8s ease-out both;
    }

    .animate-fade-rise-delay {
      animation: fade-rise 0.8s ease-out 0.2s both;
    }

    .animate-fade-rise-delay-2 {
      animation: fade-rise 0.8s ease-out 0.4s both;
    }
  </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between overflow-hidden bg-[#002238] text-white">

  <!-- Fullscreen Video Background -->
  <video
    id="bgVideo"
    autoplay
    loop
    muted
    playsinline
    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4"
    class="absolute inset-0 w-full h-full object-cover z-0"
  ></video>

  <!-- Navigation Bar -->
  <header class="relative z-10 w-full">
    <nav class="relative z-10 flex row justify-between items-center px-8 py-6 max-w-7xl mx-auto" aria-label="Main Navigation">
      <!-- Logo -->
      <a href="#" class="text-3xl tracking-tight text-white hover:opacity-90 transition-opacity select-none" style="font-family: 'Instrument Serif', serif;">
        Velorah<sup class="text-xs">®</sup>
      </a>

      <!-- Desktop Nav Links -->
      <div class="hidden md:flex items-center space-x-8">
        <a href="#home" class="nav-link text-sm text-white font-medium transition-colors" data-tab="Home">Home</a>
        <a href="#studio" class="nav-link text-sm text-[hsl(240,4%,66%)] hover:text-white transition-colors" data-tab="Studio">Studio</a>
        <a href="#about" class="nav-link text-sm text-[hsl(240,4%,66%)] hover:text-white transition-colors" data-tab="About">About</a>
        <a href="#journal" class="nav-link text-sm text-[hsl(240,4%,66%)] hover:text-white transition-colors" data-tab="Journal">Journal</a>
        <a href="#contact" class="nav-link text-sm text-[hsl(240,4%,66%)] hover:text-white transition-colors" data-tab="Reach Us">Reach Us</a>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-3">
        <button type="button" onclick="openJourneyModal()" class="liquid-glass rounded-full px-6 py-2.5 text-sm text-white hover:scale-[1.03] transition-transform cursor-pointer">
          Begin Journey
        </button>
        <button type="button" onclick="toggleMobileMenu()" class="md:hidden liquid-glass rounded-full p-2.5 text-white hover:scale-105" aria-label="Toggle menu">
          <svg id="menuIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
      </div>
    </nav>

    <!-- Mobile Dropdown Menu -->
    <div id="mobileMenu" class="hidden md:hidden absolute top-full left-0 right-0 px-6 py-5 bg-[#001726]/95 backdrop-blur-xl border-b border-white/10 z-20">
      <div class="flex flex-col space-y-4 max-w-sm mx-auto">
        <a href="#home" class="nav-link text-base py-2 text-white font-medium" data-tab="Home">Home</a>
        <a href="#studio" class="nav-link text-base py-2 text-[hsl(240,4%,66%)] hover:text-white" data-tab="Studio">Studio</a>
        <a href="#about" class="nav-link text-base py-2 text-[hsl(240,4%,66%)] hover:text-white" data-tab="About">About</a>
        <a href="#journal" class="nav-link text-base py-2 text-[hsl(240,4%,66%)] hover:text-white" data-tab="Journal">Journal</a>
        <a href="#contact" class="nav-link text-base py-2 text-[hsl(240,4%,66%)] hover:text-white" data-tab="Reach Us">Reach Us</a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="relative z-10 flex-1 flex flex-col items-center justify-center text-center px-6 pt-32 pb-40 py-[90px] max-w-7xl mx-auto my-auto">
    <!-- H1 Heading -->
    <h1
      class="text-5xl sm:text-7xl md:text-8xl leading-[0.95] tracking-[-2.46px] max-w-7xl font-normal text-white animate-fade-rise select-none"
      style="font-family: 'Instrument Serif', serif;"
    >
      Where <em class="not-italic text-[hsl(240,4%,66%)]">dreams</em> rise <em class="not-italic text-[hsl(240,4%,66%)]">through the silence.</em>
    </h1>

    <!-- Subtext -->
    <p class="text-[hsl(240,4%,66%)] text-base sm:text-lg max-w-2xl mt-8 leading-relaxed animate-fade-rise-delay">
      We're designing tools for deep thinkers, bold creators, and quiet rebels.
      Amid the chaos, we build digital spaces for sharp focus and inspired work.
    </p>

    <!-- Hero CTA Button -->
    <button
      type="button"
      onclick="openJourneyModal()"
      class="liquid-glass rounded-full px-14 py-5 text-base text-white mt-12 hover:scale-[1.03] cursor-pointer animate-fade-rise-delay-2"
    >
      Begin Journey
    </button>
  </main>

  <!-- Footer with Video Controls -->
  <footer class="relative z-10 w-full px-8 py-5 flex justify-between items-center text-xs text-white/50 pointer-events-none">
    <span class="hidden sm:inline-block tracking-widest uppercase text-[10px]">Crafted for the quiet era</span>
    <div class="flex items-center gap-3 pointer-events-auto ml-auto">
      <button type="button" onclick="togglePlay()" class="liquid-glass rounded-full px-3 py-1.5 text-xs text-white/80 hover:text-white flex items-center gap-1.5">
        <span id="motionDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="motionText">Live Motion</span>
      </button>
      <button type="button" onclick="toggleMute()" class="liquid-glass rounded-full p-2 text-white/80 hover:text-white" aria-label="Toggle audio">
        <svg id="volumeIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
      </button>
    </div>
  </footer>

  <!-- Modal Dialog Backdrop -->
  <div id="modalBackdrop" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-black/60 backdrop-blur-md" onclick="closeModal()"></div>
    <div class="relative z-10 w-full max-w-lg rounded-3xl bg-[#001726]/90 p-8 border border-white/10 shadow-2xl backdrop-blur-xl animate-fade-rise text-white">
      <button onclick="closeModal()" class="absolute right-5 top-5 rounded-full p-2 text-white/60 hover:text-white hover:bg-white/10" aria-label="Close">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>

      <!-- Modal Content Body -->
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('bgVideo');
    const modal = document.getElementById('modalBackdrop');
    const modalBody = document.getElementById('modalBody');
    const mobileMenu = document.getElementById('mobileMenu');

    // Mute / Unmute
    function toggleMute() {
      video.muted = !video.muted;
      const volIcon = document.getElementById('volumeIcon');
      if (video.muted) {
        volIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>';
      } else {
        volIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>';
      }
    }

    // Play / Pause
    function togglePlay() {
      const text = document.getElementById('motionText');
      const dot = document.getElementById('motionDot');
      if (video.paused) {
        video.play();
        text.innerText = 'Live Motion';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse';
      } else {
        video.pause();
        text.innerText = 'Paused';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400';
      }
    }

    // Mobile Menu
    function toggleMobileMenu() {
      mobileMenu.classList.toggle('hidden');
    }

    // Modal Control
    function closeModal() {
      modal.classList.add('hidden');
    }

    function openJourneyModal() {
      modalBody.innerHTML = `
        <div class="space-y-6 text-center">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-white/10 text-white/90">
            ✦ Early Access Initiation
          </span>
          <h2 class="text-4xl tracking-tight text-white pt-2" style="font-family: 'Instrument Serif', serif;">
            Step into the Silence
          </h2>
          <p class="text-sm text-[hsl(240,4%,66%)] max-w-sm mx-auto">
            Velorah is opening private realms for architects, writers, and visionaries. Enter your email to receive early invitations.
          </p>
          <form onsubmit="handleSignup(event)" class="space-y-4 pt-2">
            <input type="email" required placeholder="creator@velorah.studio" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white placeholder-white/30 text-sm focus:outline-none focus:ring-1 focus:ring-white/50">
            <button type="submit" class="w-full liquid-glass rounded-full py-3.5 text-sm text-white font-medium hover:scale-[1.02] flex items-center justify-center gap-2 cursor-pointer">
              <span>Request Key to Velorah</span> →
            </button>
            <p class="text-[11px] text-center text-white/40">Pure encryption. Zero spam. Complete tranquility.</p>
          </form>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function handleSignup(e) {
      e.preventDefault();
      modalBody.innerHTML = `
        <div class="p-6 rounded-2xl bg-white/5 border border-white/10 text-center space-y-3">
          <div class="text-emerald-400 text-4xl">✓</div>
          <h3 class="text-lg font-medium text-white">Your journey has commenced</h3>
          <p class="text-xs text-[hsl(240,4%,66%)]">We have recorded your request. Watch for an invitation sealed in quiet elegance.</p>
          <button onclick="closeModal()" class="liquid-glass rounded-full px-6 py-2 text-xs text-white hover:scale-[1.03] mt-2 inline-block">
            Return to Sanctuary
          </button>
        </div>
      `;
    }

    // Nav click handlers
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const tab = link.getAttribute('data-tab');
        mobileMenu.classList.add('hidden');

        if (tab === 'Home') {
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        const tabData = {
          'Studio': `
            <div class="space-y-4">
              <h2 class="text-4xl tracking-tight text-white" style="font-family: 'Instrument Serif', serif;">Velorah Studio</h2>
              <p class="text-sm text-[hsl(240,4%,66%)] leading-relaxed">Our studio crafts bespoke digital environments where deep concentration thrives. We strip away notification clutter and algorithmic friction.</p>
              <div class="grid grid-cols-2 gap-3 pt-3">
                <div class="p-3.5 rounded-xl bg-white/5 border border-white/10">
                  <div class="text-xs font-semibold text-white">Monolith Engine</div>
                  <div class="text-[11px] text-[hsl(240,4%,66%)] mt-1">Zero-latency thinking canvas</div>
                </div>
                <div class="p-3.5 rounded-xl bg-white/5 border border-white/10">
                  <div class="text-xs font-semibold text-white">Aura Sync</div>
                  <div class="text-[11px] text-[hsl(240,4%,66%)] mt-1">Biometric focus harmonics</div>
                </div>
              </div>
              <button onclick="openJourneyModal()" class="liquid-glass rounded-full px-6 py-2.5 text-xs text-white hover:scale-[1.03] mt-2 inline-block w-full text-center">Join the Studio Waitlist</button>
            </div>`,
          'About': `
            <div class="space-y-4">
              <h2 class="text-4xl tracking-tight text-white" style="font-family: 'Instrument Serif', serif;">Our Philosophy</h2>
              <p class="text-sm text-[hsl(240,4%,66%)] leading-relaxed">In an era dominated by relentless stimuli, the greatest luxury is sustained attention. Velorah was founded on the belief that profound ideas require quiet, intentional spaces.</p>
              <blockquote class="border-l-2 border-white/30 pl-4 py-1 italic text-white/90 text-sm">"Silence is not the absence of sound; it is the presence of clarity."</blockquote>
            </div>`,
          'Journal': `
            <div class="space-y-4">
              <h2 class="text-4xl tracking-tight text-white" style="font-family: 'Instrument Serif', serif;">The Journal</h2>
              <div class="space-y-3 text-left">
                <div class="p-3 rounded-xl bg-white/5 border border-white/10">
                  <span class="text-[10px] uppercase tracking-wider text-[hsl(240,4%,66%)]">Vol. IV — Focus</span>
                  <div class="text-sm font-medium text-white">The Architecture of Stillness</div>
                </div>
                <div class="p-3 rounded-xl bg-white/5 border border-white/10">
                  <span class="text-[10px] uppercase tracking-wider text-[hsl(240,4%,66%)]">Vol. III — Craft</span>
                  <div class="text-sm font-medium text-white">Tactile Interfaces in a Flat World</div>
                </div>
              </div>
            </div>`,
          'Reach Us': `
            <div class="space-y-4">
              <h2 class="text-4xl tracking-tight text-white" style="font-family: 'Instrument Serif', serif;">Reach Us</h2>
              <p class="text-sm text-[hsl(240,4%,66%)] leading-relaxed">We welcome private inquiries, architectural collaborations, and thoughtful dialogues from creators worldwide.</p>
              <div class="p-4 rounded-xl bg-white/5 border border-white/10 space-y-2 text-xs">
                <div class="flex justify-between"><span class="text-[hsl(240,4%,66%)]">Direct Desk:</span><span class="text-white font-mono">sanctuary@velorah.studio</span></div>
                <div class="flex justify-between"><span class="text-[hsl(240,4%,66%)]">Location:</span><span class="text-white">Zurich / Kyoto / Cloud</span></div>
              </div>
              <button onclick="openJourneyModal()" class="liquid-glass rounded-full px-6 py-2.5 text-xs text-white hover:scale-[1.03] mt-2 inline-block w-full text-center">Dispatch a Message</button>
            </div>`
        };

        if (tabData[tab]) {
          modalBody.innerHTML = tabData[tab];
          modal.classList.remove('hidden');
        }
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
